<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — CornHub 🌽</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌽</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="kernel" id="logo-icon"></span> CornHub
    </a>
  </header>

  <main class="auth-page">
    <form class="auth-card" id="auth-form">
      <h1 id="auth-title">Iniciar sesión</h1>
      <p class="auth-note" id="auth-note">Entrá con tu correo y contraseña.</p>

      <div id="name-field" style="display:none">
        <label for="name-input">Nombre de tu canal</label>
        <input type="text" id="name-input" placeholder="Mi canal de elotes" maxlength="40" />
      </div>

      <label for="email-input">Correo electrónico</label>
      <input type="email" id="email-input" required autocomplete="email" />

      <label for="password-input">Contraseña</label>
      <input type="password" id="password-input" required minlength="6" autocomplete="current-password" />

      <p class="auth-error" id="auth-error" style="display:none"></p>

      <button type="submit" class="primary-btn" id="auth-submit-btn">Iniciar sesión</button>
      <button type="button" class="auth-switch-btn" id="auth-switch-btn">¿No tenés cuenta? Creá una</button>
    </form>
  </main>

  <script src="svg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
