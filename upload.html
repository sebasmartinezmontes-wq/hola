<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subir video — CornHub 🌽</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌽</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">
      <span class="kernel" id="logo-icon"></span> CornHub
    </a>
    <div id="auth-slot"></div>
  </header>

  <main class="auth-page">
    <form class="auth-card" id="upload-form">
      <h1>Subir video</h1>
      <p class="auth-note">
        El video se sube de verdad y queda visible para todos los que entren
        al sitio (o solo en tu navegador si la sincronización no está disponible).
      </p>

      <label for="title-input">Título del video</label>
      <input type="text" id="title-input" placeholder="Mi elote hace algo increíble..." required maxlength="90" />

      <label for="cat-select">Categoría</label>
      <select id="cat-select"></select>

      <label for="video-file-input">Archivo de video</label>
      <input type="file" id="video-file-input" accept="video/*" required />

      <div id="upload-progress-wrap" style="display:none">
        <label>Subiendo...</label>
        <div class="progress-track"><div class="progress-fill" id="upload-progress-fill"></div></div>
      </div>

      <button type="submit" class="primary-btn" id="upload-submit-btn">Publicar</button>
    </form>
  </main>

  <script src="data.js"></script>
  <script src="svg.js"></script>
  <script src="storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="dbsync.js"></script>
  <script src="auth.js"></script>
  <script src="upload.js"></script>
</body>
</html>
